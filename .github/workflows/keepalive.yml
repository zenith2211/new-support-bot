name: keep-alive

# Pings the free-tier web service so it doesn't spin down after ~15 min idle.
# Set the URL once in the repo: Settings -> Secrets and variables -> Actions
# -> Variables -> New variable, name KEEPALIVE_URL, e.g.
#   https://your-service.onrender.com/health
# Note: scheduled runs are best effort, and GitHub disables schedules after
# 60 days with no commits to the repo.

on:
  schedule:
    - cron: "*/10 * * * *"   # every 10 minutes (UTC)
  workflow_dispatch:          # allows manual runs from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint (with cold-start retries)
        env:
          URL: ${{ vars.KEEPALIVE_URL }}
        run: |
          if [ -z "$URL" ]; then
            echo "KEEPALIVE_URL variable is not set — nothing to ping."
            exit 0
          fi
          for i in 1 2 3 4 5; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 90 "$URL") || code="000"
            echo "Attempt $i -> HTTP $code"
            if [ "$code" = "200" ]; then
              echo "Service is awake."
              exit 0
            fi
            sleep 25
          done
          echo "::error::Health endpoint did not return 200 after retries"
          exit 1
